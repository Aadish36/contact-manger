<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>signup</title>
</head>
<body>
<section class="container">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <div class="my-card mt-1">
          <div th:if="${session.message}" th:classappend="${session.message.type}" class="alert alert-primary" role="alert">
              <p class="text-center" th:text="${session.message.content}"></p>

          </div>
        <h1  class="text-center">Sign Up</h1>
          <form novalidate action=" " th:action="@{/signup}" method="post"  th:object="${user}">
              <div class="mb-3">
                  <label for="name_field" class="form-label">Your Name</label>
                  <input name="Name" type="text"
                         class="form-control "

                         th:classappend="${#fields.hasErrors('name')}? 'is-invalid'"
                         id="name_field" aria-describedby="emailHelp"
                         placeholder="Enter your name"
                         required
                         th:value="${user.name}"
                  />
                  <div class="invalid-feedback" th:each="e:${#fields.errors('name')}" th:text="${e}">

                  </div>


              </div>
              <div class="mb-3">
                  <label for="email_field" class="form-label">email</label>
                  <input name="Email" type="email" class="form-control" id="email_field" aria-describedby="emailHelp"
                         placeholder="Enter email"
                         th:value="${user.email}"
                         required
                  >
              </div>
              <div class="mb-3">
                  <label  for="password_field" class="form-label">Your password</label>
                  <input name="Password" type="password" class="form-control" id="password_field" aria-describedby="emailHelp"
                         placeholder="Password"
                         th:field="*{password}"
                         required
                  >


              </div>
              <div class="form-group">
                 <textarea name="about"
                           th:text="${user.about}"
                           placeholder="Enter Here"
                           cols="10"
                           rows="5"
                           class="form-control"
                           id="message-field"></textarea>
              </div>
              <div class="form-group form-check textCenter">
                  <input type="checkbox" class="form-check-input" id="agreement" name="agreement"/>
                  <label for="agreement">Accept t&c</label>
              </div>
              <div class="container">
                  <button  type="submit"    class="btn bg-primary text-white">Submit</button>
              </div>
              <div class="container">
                  <button  type="reset"    class="btn btn-warning">Reset</button>
              </div>



          </form>
      </div>
    </div>
  </div>
</section>

</body>
</html>
